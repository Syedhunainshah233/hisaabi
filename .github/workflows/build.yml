name: Build Hisaabi APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'README.md' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hisaabi-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hisaabi-test-apk
          path: Hisaabi-test.apk

      - name: Publish test APK as a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build Hisaabi-test.apk \
            --title "Hisaabi test build" \
            --notes "Latest test APK built from main (${GITHUB_SHA::7})." \
            --prerelease

  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run screen tests
        id: tests
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Save screenshots and test report to the 'screenshots' branch
        if: always()
        run: |
          mkdir -p /tmp/out/screens /tmp/out/report
          cp app/build/screens/*.png /tmp/out/screens/ 2>/dev/null || true
          cp -r app/build/reports/tests/testDebugUnitTest/. /tmp/out/report/ 2>/dev/null || true
          cp -r app/build/test-results/testDebugUnitTest/. /tmp/out/report/xml/ 2>/dev/null || true
          echo "tests: ${{ steps.tests.outcome }} @ ${GITHUB_SHA::7}" > /tmp/out/STATUS.txt
          git config user.name "hisaabi-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f origin screenshots
